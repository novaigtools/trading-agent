name: SL/TP Monitor (cloud backstop — protects positions while the laptop sleeps)

# The primary SL/TP + trailing-stop monitor runs on the laptop every 5 minutes.
# This cloud copy takes over ONLY when the laptop's heartbeat is stale (asleep/off),
# so the two never both try to close the same position. GitHub throttles cron, so the
# real cadence is looser than requested — fine for a backstop, and vastly better than
# the "positions unwatched for days" failure that lost money before.
on:
  schedule:
    - cron: '*/15 * * * *'   # requested every 15 min; GitHub throttles
  workflow_dispatch:

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Skip if the laptop is awake (fresh heartbeat)
        id: guard
        run: |
          STATUS=$(python3 heartbeat.py check 50)
          echo "Laptop heartbeat: $STATUS"
          if [ "$STATUS" = "active" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Laptop is monitoring — cloud backstop stands down."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Laptop is quiet — cloud takes over position monitoring."
          fi

      - name: Check SL/TP (no pip install needed)
        if: steps.guard.outputs.run == 'true'
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python3 sl_monitor.py

      - name: Save state if changed
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "Trading Bot"
          git config user.email "bot@trading-agent.com"
          git add risk_state.json trades.csv
          if git diff --staged --quiet; then
            echo "No triggers fired."
            exit 0
          fi
          git commit -m "SL/TP triggered $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push && exit 0
            echo "Push failed, rebasing and retrying ($i/3)..."
            git pull --rebase
          done
          git push
